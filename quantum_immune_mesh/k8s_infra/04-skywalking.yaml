apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-postgres
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skywalking-postgres
  template:
    metadata:
      labels:
        app: skywalking-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: skywalking
        - name: POSTGRES_USER
          value: skywalking
        - name: POSTGRES_PASSWORD
          value: skywalking
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-postgres
  namespace: observability
spec:
  ports:
  - port: 5432
  selector:
    app: skywalking-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-oap
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skywalking-oap
  template:
    metadata:
      labels:
        app: skywalking-oap
    spec:
      containers:
      - name: oap
        image: apache/skywalking-oap-server:9.4.0
        env:
        - name: SW_STORAGE
          value: postgresql
        - name: SW_JDBC_URL
          value: jdbc:postgresql://skywalking-postgres:5432/skywalking
        - name: SW_DATA_SOURCE_USER
          value: skywalking
        - name: SW_DATA_SOURCE_PASSWORD
          value: skywalking
        ports:
        - containerPort: 11800
        - containerPort: 12800
---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-oap
  namespace: observability
spec:
  ports:
  - name: grpc
    port: 11800
  - name: http
    port: 12800
  selector:
    app: skywalking-oap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-ui
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skywalking-ui
  template:
    metadata:
      labels:
        app: skywalking-ui
    spec:
      containers:
      - name: ui
        image: apache/skywalking-ui:9.4.0
        env:
        - name: SW_OAP_ADDRESS
          value: http://skywalking-oap:12800
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-ui
  namespace: observability
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: skywalking-ui

apiVersion: v1
kind: Service
metadata:
  name: skywalking-ui-bridge-service
  namespace: observability
spec:
  type: NodePort
  selector:
    app: skywalking-ui
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 32123 # 🎯 PUERTO PUENTE: El puerto fijo que amarraremos al motor de la Mac

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-cuantica-deployment
  namespace: default
  labels:
    app: api-cuantica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-cuantica
  template:
    metadata:
      labels:
        app: api-cuantica
    spec:
      containers:
      - name: api-cuantica-container
        image: api-cuantica-modular-img:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        # Inyección de la firma secreta para el JWT
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: llaves-credenciales-cuanticas
              key: jwt-secret-key
        # 🔐 INYECCIÓN SEGURA: El password entra en caliente desde el Secret
        - name: AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: llaves-credenciales-cuanticas
              key: auth-password
        volumeMounts:
        - name: code-volume
          mountPath: /app/src/routes.py
          subPath: routes.py
      volumes:
      - name: code-volume
        configMap:
          name: api-cuantica-routes-code
---
apiVersion: v1
kind: Service
metadata:
  name: api-cuantica-service
  namespace: default
spec:
  selector:
    app: api-cuantica
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP
